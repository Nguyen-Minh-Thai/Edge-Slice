<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    .title { font: 700 28px Inter, Arial, sans-serif; fill: #111827; }
    .subtitle { font: 500 14px Inter, Arial, sans-serif; fill: #4b5563; }
    .axis { stroke: #374151; stroke-width: 1.4; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .tick { font: 12px Inter, Arial, sans-serif; fill: #4b5563; }
    .label { font: 13px Inter, Arial, sans-serif; fill: #111827; }
    .value { font: 700 12px Inter, Arial, sans-serif; fill: #111827; }
    .small { font: 11px Inter, Arial, sans-serif; fill: #6b7280; }
  </style>
  <text x="100" y="46" class="title">EdgeSlice vs SConv Speedup</text>
  <text x="100" y="74" class="subtitle">Positive means EdgeSlice is faster than SConv | real input=single-image, images=10, resolution=224x224, runs=10, warmup=3, L1=64KB</text>
  <text x="22" y="355.0" class="small" transform="rotate(-90 22 355.0)">Speedup vs SConv (%)</text>
  <line x1="100" y1="605.0" x2="1230" y2="605.0" class="grid"/>
  <text x="88" y="609.0" text-anchor="end" class="tick">-24.7%</text>
  <line x1="100" y1="505.0" x2="1230" y2="505.0" class="grid"/>
  <text x="88" y="509.0" text-anchor="end" class="tick">-14.8%</text>
  <line x1="100" y1="405.0" x2="1230" y2="405.0" class="grid"/>
  <text x="88" y="409.0" text-anchor="end" class="tick">-4.9%</text>
  <line x1="100" y1="305.0" x2="1230" y2="305.0" class="grid"/>
  <text x="88" y="309.0" text-anchor="end" class="tick">+4.9%</text>
  <line x1="100" y1="205.0" x2="1230" y2="205.0" class="grid"/>
  <text x="88" y="209.0" text-anchor="end" class="tick">+14.8%</text>
  <line x1="100" y1="105.0" x2="1230" y2="105.0" class="grid"/>
  <text x="88" y="109.0" text-anchor="end" class="tick">+24.7%</text>
  <line x1="100" y1="355.0" x2="1230" y2="355.0" class="axis"/>
  <line x1="100" y1="105" x2="100" y2="605" class="axis"/>
  <text x="382.5" y="662" text-anchor="middle" class="label">resnet50</text>
  <rect x="267.5" y="181.1" width="230.0" height="173.9" rx="4" fill="#2563eb"/>
  <text x="382.5" y="173.1" text-anchor="middle" class="value">+17.2%</text>
  <text x="947.5" y="662" text-anchor="middle" class="label">mobilenet_v2</text>
  <rect x="832.5" y="146.7" width="230.0" height="208.3" rx="4" fill="#2563eb"/>
  <text x="947.5" y="138.7" text-anchor="middle" class="value">+20.6%</text>
  <rect x="920" y="34" width="14" height="14" rx="3" fill="#2563eb"/>
  <text x="940" y="46" class="small">EdgeSlice</text>
