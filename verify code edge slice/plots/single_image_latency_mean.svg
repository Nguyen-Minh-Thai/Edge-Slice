<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    .title { font: 700 28px Inter, Arial, sans-serif; fill: #111827; }
    .subtitle { font: 500 14px Inter, Arial, sans-serif; fill: #4b5563; }
    .axis { stroke: #374151; stroke-width: 1.4; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .tick { font: 12px Inter, Arial, sans-serif; fill: #4b5563; }
    .label { font: 13px Inter, Arial, sans-serif; fill: #111827; }
    .value { font: 700 12px Inter, Arial, sans-serif; fill: #111827; }
    .small { font: 11px Inter, Arial, sans-serif; fill: #6b7280; }
  </style>
  <text x="100" y="46" class="title">Mean Latency by Method</text>
  <text x="100" y="74" class="subtitle">real input=single-image, images=10, resolution=224x224, runs=10, warmup=3, L1=64KB</text>
  <text x="22" y="355.0" class="small" transform="rotate(-90 22 355.0)">Mean latency (ms, lower is better)</text>
  <line x1="100" y1="605.0" x2="1230" y2="605.0" class="grid"/>
  <text x="88" y="609.0" text-anchor="end" class="tick">0.0 ms</text>
  <line x1="100" y1="505.0" x2="1230" y2="505.0" class="grid"/>
  <text x="88" y="509.0" text-anchor="end" class="tick">40.0 ms</text>
  <line x1="100" y1="405.0" x2="1230" y2="405.0" class="grid"/>
  <text x="88" y="409.0" text-anchor="end" class="tick">80.0 ms</text>
  <line x1="100" y1="305.0" x2="1230" y2="305.0" class="grid"/>
