  <line x1="100" y1="105.0" x2="1230" y2="105.0" class="grid"/>
  <text x="88" y="109.0" text-anchor="end" class="tick">200.0 ms</text>
  <line x1="100" y1="605.0" x2="1230" y2="605.0" class="axis"/>
  <line x1="100" y1="105" x2="100" y2="605" class="axis"/>
  <text x="382.5" y="662" text-anchor="middle" class="label">resnet50</text>
  <rect x="267.5" y="284.0" width="71.3" height="321.0" rx="4" fill="#6b7280"/>
  <text x="303.2" y="276.0" text-anchor="middle" class="value">128.4 ms</text>
  <rect x="346.8" y="309.5" width="71.3" height="295.5" rx="4" fill="#2563eb"/>
  <text x="382.5" y="301.5" text-anchor="middle" class="value">118.2 ms</text>
  <rect x="426.2" y="248.3" width="71.3" height="356.7" rx="4" fill="#dc2626"/>
  <text x="461.8" y="240.3" text-anchor="middle" class="value">142.7 ms</text>
  <text x="947.5" y="662" text-anchor="middle" class="label">mobilenet_v2</text>
  <rect x="832.5" y="474.8" width="71.3" height="130.2" rx="4" fill="#6b7280"/>
  <text x="868.2" y="466.8" text-anchor="middle" class="value">52.1 ms</text>
  <rect x="911.8" y="493.0" width="71.3" height="112.0" rx="4" fill="#2563eb"/>
  <text x="947.5" y="485.0" text-anchor="middle" class="value">44.8 ms</text>
  <rect x="991.2" y="464.0" width="71.3" height="141.0" rx="4" fill="#dc2626"/>
